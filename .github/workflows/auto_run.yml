name: Auto build and run bakeoff on 3 O/Ses

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '**.py'
      - '**.txt'
      - '**.yml'
    branches: [ "main" ]
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.py'
      - '**.txt'
      - '**.yml'
    branches: [ "main" ]

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [macos-26-intel, macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-11-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
          go-version: '1.27.x'
          cache: false
          
    - name: Setup bakeoff
      run: |
        go get
        go build -o . -v ./...
        ./bakeoff -h

    - name: Run bakeoff
      run: |
        ./bakeoff 100000000


